<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">MyShop</a>
        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cart-badge" class="badge" style="display: none;">0</span>
        </a>
    </nav>

    <header>
        <h1>Shopping Cart</h1>
    </header>

    <main class="cart-container">
        <!-- Empty cart state -->
        <div id="cart-empty" style="display: none; text-align: center; padding: 50px;">
            <h2>Your cart is empty 🛒</h2>
            <p><a href="index.html" style="color: #3498db; text-decoration: none;">Continue Shopping</a></p>
        </div>
        
        <!-- Cart items container -->
        <div id="cart-items"></div>

        <!-- Total summary -->
        <div id="cart-summary" class="cart-summary" style="display: none;">
            <h3>Total: <span id="total-price">$0.00</span></h3>
            <button class="btn-checkout" onclick="alert('Checkout is not available yet!')">Checkout</button>
        </div>
    </main>

    <script src="app.js"></script>
    
    <script>
        const cartItemsContainer = document.getElementById('cart-items');
        const emptyState = document.getElementById('cart-empty');
        const summaryContainer = document.getElementById('cart-summary');
        const totalPriceElement = document.getElementById('total-price');

        function renderCart() {
            const cart = getCart(); 
            cartItemsContainer.innerHTML = ''; 

            if (cart.length === 0) {
                emptyState.style.display = 'block';
                summaryContainer.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            summaryContainer.style.display = 'flex';

            let totalPrice = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                totalPrice += itemTotal;

                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <img src="${item.thumbnail}" alt="${item.title}">
                    <div class="item-info">
                        <h3>${item.title}</h3>
                        <p>Price: $${item.price}</p>
                    </div>
                    <div class="item-actions">
                        <div class="quantity-control">
                            <button class="btn-decrease" ${item.quantity <= 1 ? 'disabled' : ''}>-</button>
                            <span class="quantity-num">${item.quantity}</span>
                            <button class="btn-increase">+</button>
                        </div>
                        <p class="item-total">$${itemTotal.toFixed(2)}</p>
                        <button class="btn-delete">Remove</button>
                    </div>
                `;

                row.querySelector('.btn-increase').addEventListener('click', () => {
                    updateQuantity(item.id, item.quantity + 1);
                });

                row.querySelector('.btn-decrease').addEventListener('click', () => {
                    if (item.quantity > 1) {
                        updateQuantity(item.id, item.quantity - 1);
                    }
                });

                row.querySelector('.btn-delete').addEventListener('click', () => {
                    if (confirm('Are you sure you want to remove this item?')) {
                        removeFromCart(item.id);
                    }
                });

                cartItemsContainer.appendChild(row);
            });

            totalPriceElement.textContent = `$${totalPrice.toFixed(2)}`;
        }

        function updateQuantity(productId, newQuantity) {
            let cart = getCart();
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity = newQuantity;
                saveCart(cart); 
                renderCart(); 
            }
        }

        function removeFromCart(productId) {
            let cart = getCart();
            cart = cart.filter(i => i.id !== productId);
            saveCart(cart); 
            renderCart(); 
        }

        renderCart();
    </script>
</body>
</html>
