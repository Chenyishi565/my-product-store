<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">MyShop</a>
        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cart-badge" class="badge" style="display: none;">0</span>
        </a>
    </nav>

    <header>
        <h1>Checkout</h1>
    </header>

    <main class="checkout-container">
        <div class="checkout-form">
            <h2>Shipping Information</h2>
            <form id="payment-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" required placeholder="123 Main St, City">
                </div>
                <div class="form-group">
                    <label for="card">Card Number (Mock)</label>
                    <input type="text" id="card" required placeholder="xxxx-xxxx-xxxx-xxxx" maxlength="19">
                </div>
            </form>
        </div>

        <div class="checkout-summary">
            <h2>Order Summary</h2>
            <div class="summary-row">
                <span>Items total:</span>
                <span id="checkout-total">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Shipping:</span>
                <span>Free</span>
            </div>
            <hr>
            <div class="summary-row total">
                <span>Total:</span>
                <span id="checkout-grand-total">$0.00</span>
            </div>
            <!-- 提交按钮绑定了全局的模拟支付函数 -->
            <button class="btn-pay" onclick="processPayment(event)">Pay Now</button>
        </div>
    </main>

    <script src="app.js"></script>
    
    <script>
        // 页面加载时，计算总价并显示
        document.addEventListener('DOMContentLoaded', () => {
            const cart = getCart();
            if (cart.length === 0) {
                alert("Your cart is empty! Redirecting to store.");
                window.location.href = 'index.html';
                return;
            }
            
            let total = 0;
            cart.forEach(item => total += item.price * item.quantity);
            
            // 格式化为两位小数
            const formattedTotal = total.toFixed(2);
            document.getElementById('checkout-total').textContent = `$${formattedTotal}`;
            document.getElementById('checkout-grand-total').textContent = `$${formattedTotal}`;
        });
    </script>
</body>
</html>
