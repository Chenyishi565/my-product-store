<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store - Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="logo">MyShop</a>
        <a href="cart.html" class="cart-link">
            🛒 Cart
            <span id="cart-badge" class="badge" style="display: none;">0</span>
        </a>
    </nav>

    <header>
        <h1>Featured Products</h1>
    </header>

    <main>
        <div id="loading">Loading products...</div>
        <div id="product-container" class="product-grid"></div>
    </main>

    <script src="app.js"></script>
    
    <script>
        const productContainer = document.getElementById('product-container');
        const loadingElement = document.getElementById('loading');
        const API_URL = 'https://dummyjson.com/products';

        async function fetchProducts() {
            try {
                // 发送 GET 请求获取数据
                const response = await fetch(API_URL);
                const data = await response.json();
                
                loadingElement.style.display = 'none';
                
                data.products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <img src="${product.thumbnail}" alt="${product.title}">
                        <h3>${product.title}</h3>
                        <p class="price">$${product.price}</p>
                        <button class="btn-add-cart">Add to Cart</button>
                    `;
                    
                    const addBtn = card.querySelector('.btn-add-cart');
                    addBtn.addEventListener('click', () => {
                        addToCart(product.id, product.title, product.price, product.thumbnail);
                    });

                    productContainer.appendChild(card);
                });
            } catch (error) {
                loadingElement.textContent = 'Failed to load products. Please refresh.';
                console.error(error);
            }
        }
        fetchProducts();
    </script>
</body>
</html>
