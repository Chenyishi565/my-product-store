<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的网店 - 商品列表</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo">MyShop</a>
        <a href="cart.html" class="cart-link">
            🛒 购物车
            <!-- 购物车数量角标 -->
            <span id="cart-badge" class="badge" style="display: none;">0</span>
        </a>
    </nav>

    <header>
        <h1>热门产品目录</h1>
    </header>

    <main>
        <div id="loading">正在加载产品信息...</div>
        <div id="product-container" class="product-grid"></div>
    </main>

    <!-- 引入全局公共 JS -->
    <script src="app.js"></script>
    
    <!-- 首页专属逻辑 -->
    <script>
        const productContainer = document.getElementById('product-container');
        const loadingElement = document.getElementById('loading');
        const API_URL = 'https://dummyjson.com/products';

        async function fetchProducts() {
            try {
                // 发送 GET 请求获取数据 (老师白板要求的 GET)
                const response = await fetch(API_URL);
                const data = await response.json();
                
                loadingElement.style.display = 'none';
                
                data.products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <img src="${product.thumbnail}" alt="${product.title}">
                        <h3>${product.title}</h3>
                        <p class="price">$${product.price}</p>
                        <button class="btn-add-cart">加入购物车</button>
                    `;
                    
                    // 绑定加入购物车按钮事件
                    const addBtn = card.querySelector('.btn-add-cart');
                    addBtn.addEventListener('click', () => {
                        // 调用 app.js 中的 addToCart 函数
                        addToCart(product.id, product.title, product.price, product.thumbnail);
                    });

                    productContainer.appendChild(card);
                });
            } catch (error) {
                loadingElement.textContent = '获取产品失败，请刷新重试。';
                console.error(error);
            }
        }
        fetchProducts();
    </script>
</body>
</html>
